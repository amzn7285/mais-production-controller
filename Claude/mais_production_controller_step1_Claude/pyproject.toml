[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mais-production-controller"
version = "0.1.0"
description = "MAIS Phase 2 — Production Controller (structure and interfaces only, Step 1)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Kept intentionally minimal for Step 1: nothing here is a
# concrete provider SDK. Provider-specific dependencies (an HTTP
# client for a specific TTS API, etc.) are added when the
# corresponding infrastructure adapter is implemented, not now.
dependencies = [
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mais"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
